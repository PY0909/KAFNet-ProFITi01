<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>论文 30 天学习打卡</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f2;
      --surface: #ffffff;
      --surface-2: #e9eee9;
      --text: #17221c;
      --muted: #647068;
      --border: #d5ddd7;
      --green: #246b4a;
      --green-soft: #dcebe2;
      --blue: #32658c;
      --blue-soft: #dce9f2;
      --amber: #a76419;
      --amber-soft: #f4e7d4;
      --rust: #a4472f;
      --rust-soft: #f2dfda;
      --charcoal: #223029;
      --danger: #a33c32;
      --shadow: 0 8px 24px rgba(26, 43, 33, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(50, 101, 140, 0.28);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
    }

    .masthead {
      background: var(--charcoal);
      color: #f7faf8;
      border-bottom: 4px solid var(--green);
    }

    .masthead-inner,
    .main-content {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .masthead-inner {
      padding: 22px 0 18px;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #b9c9bf;
      font-size: 13px;
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: 0;
    }

    .date-range {
      margin: 5px 0 0;
      color: #d3ddd7;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn,
    .icon-btn,
    .tab-button {
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .btn {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    .btn:hover,
    .icon-btn:hover,
    .tab-button:hover {
      border-color: #9eaba2;
      background: #f7faf8;
    }

    .btn-primary {
      border-color: var(--green);
      background: var(--green);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1e5c40;
      border-color: #1e5c40;
    }

    .btn-dark {
      border-color: #52635a;
      background: transparent;
      color: #f7faf8;
    }

    .btn-dark:hover {
      background: #314239;
      border-color: #77877e;
    }

    .btn-danger {
      color: #f8deda;
    }

    .btn svg,
    .icon-btn svg,
    .tab-button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke-width: 2;
    }

    .save-status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      color: #bdcbc2;
      font-size: 13px;
    }

    .save-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #76ba8d;
    }

    .main-content {
      padding: 24px 0 52px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      min-height: 112px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .stat-context {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .roadmap-section {
      margin-top: 18px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .section-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h2,
    h3 {
      margin: 0;
      font-weight: 500;
      letter-spacing: 0;
    }

    h2 {
      font-size: 19px;
    }

    h3 {
      font-size: 16px;
    }

    .section-note {
      color: var(--muted);
      font-size: 13px;
    }

    .roadmap {
      display: grid;
      grid-template-columns: 5fr 6fr 6fr 10fr 3fr;
      gap: 5px;
      min-height: 88px;
    }

    .roadmap-stage {
      position: relative;
      min-width: 0;
      padding: 11px;
      overflow: hidden;
      border: 0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
    }

    .roadmap-stage::after {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: var(--stage-progress, 0%);
      max-width: calc(100% - 16px);
      height: 4px;
      border-radius: 2px;
      background: currentColor;
      content: "";
      opacity: 0.72;
    }

    .roadmap-stage.foundation {
      background: var(--green-soft);
      color: #194d36;
    }

    .roadmap-stage.chapter1 {
      background: var(--blue-soft);
      color: #234f70;
    }

    .roadmap-stage.chapter2 {
      background: var(--amber-soft);
      color: #7b4812;
    }

    .roadmap-stage.chapter3 {
      background: var(--rust-soft);
      color: #803522;
    }

    .roadmap-stage.wrap {
      background: #e4e6e2;
      color: #424b45;
    }

    .stage-dates {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }

    .stage-percent {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 22px;
      padding: 4px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
    }

    .tab-button {
      display: inline-flex;
      min-width: 106px;
      min-height: 40px;
      flex: 1 0 auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-color: transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
    }

    .tab-button[aria-selected="true"] {
      border-color: var(--border);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 7px rgba(26, 43, 33, 0.08);
    }

    .view-panel {
      display: none;
      padding-top: 22px;
    }

    .view-panel.is-active {
      display: block;
    }

    .today-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
      gap: 22px;
      align-items: start;
    }

    .day-sheet,
    .checkin-sheet {
      min-width: 0;
      border-top: 3px solid var(--green);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 18px 15px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-header-copy {
      min-width: 0;
    }

    .day-meta {
      margin: 0 0 3px;
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
    }

    .day-title {
      font-size: 21px;
      line-height: 1.35;
    }

    .day-nav {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .icon-btn:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .sheet-section {
      padding: 17px 18px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-section:last-child {
      border-bottom: 0;
    }

    .subheading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subheading svg {
      width: 17px;
      height: 17px;
      color: var(--green);
    }

    .timeline {
      display: grid;
      gap: 0;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 118px 92px minmax(0, 1fr);
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #e7ebe8;
    }

    .timeline-row:last-child {
      border-bottom: 0;
    }

    .timeline-time {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .timeline-kind {
      color: var(--muted);
      font-size: 13px;
    }

    .learning-list,
    .deliverable-list {
      margin: 0;
      padding-left: 20px;
    }

    .learning-list li,
    .deliverable-list li {
      margin: 5px 0;
    }

    .task-list {
      display: grid;
      gap: 0;
    }

    .task-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 11px 0;
      border-bottom: 1px solid #e7ebe8;
    }

    .task-row:last-child {
      border-bottom: 0;
    }

    .task-row input {
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      accent-color: var(--green);
    }

    .task-row label {
      cursor: pointer;
    }

    .task-row input:checked + label {
      color: var(--muted);
      text-decoration: line-through;
    }

    .output-box {
      padding: 12px 14px;
      border-left: 4px solid var(--amber);
      background: var(--amber-soft);
      color: #5e3c16;
    }

    .checkin-sheet {
      position: sticky;
      top: 16px;
      border-top-color: var(--blue);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-weight: 500;
    }

    .form-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .form-control {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }

    input.form-control {
      height: 42px;
      padding: 8px 11px;
    }

    textarea.form-control {
      min-height: 146px;
      resize: vertical;
      padding: 10px 11px;
    }

    .day-progress-track,
    .progress-track {
      width: 100%;
      overflow: hidden;
      border-radius: 3px;
      background: var(--surface-2);
    }

    .day-progress-track {
      height: 9px;
      margin: 7px 0 14px;
    }

    .progress-track {
      height: 7px;
    }

    .progress-fill {
      height: 100%;
      background: var(--green);
      transition: width 180ms ease;
    }

    .day-progress-text {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .checkin-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .calendar-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 15px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .calendar-spacer {
      min-height: 1px;
    }

    .calendar-day {
      display: flex;
      min-height: 128px;
      min-width: 0;
      flex-direction: column;
      align-items: stretch;
      padding: 11px;
      border: 1px solid var(--border);
      border-top: 4px solid var(--phase-color);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
    }

    .calendar-day:hover {
      border-right-color: #9eaba2;
      border-bottom-color: #9eaba2;
      border-left-color: #9eaba2;
      box-shadow: var(--shadow);
    }

    .calendar-day.is-done {
      background: #f0f6f2;
    }

    .calendar-day-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .calendar-date {
      font-size: 19px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .calendar-weekday {
      color: var(--muted);
      font-size: 12px;
    }

    .calendar-title {
      display: -webkit-box;
      min-height: 44px;
      margin-top: 7px;
      overflow: hidden;
      font-size: 13px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .calendar-progress {
      margin-top: auto;
      padding-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .chapter-list,
    .experiment-list {
      display: grid;
      gap: 12px;
    }

    .chapter-row,
    .experiment-row {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 120px;
      gap: 20px;
      align-items: center;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .chapter-row:first-child,
    .experiment-row:first-child {
      border-top: 1px solid var(--border);
    }

    .row-kicker {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-details {
      color: var(--muted);
      font-size: 14px;
    }

    .row-progress-value {
      margin-bottom: 5px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .experiment-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 4px 9px;
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .experiment-status.done {
      background: var(--green-soft);
      color: #194d36;
    }

    .experiment-status.active {
      background: var(--amber-soft);
      color: #71420f;
    }

    .empty-message {
      padding: 22px 0;
      color: var(--muted);
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .roadmap {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .roadmap-stage.chapter3 {
        grid-column: span 2;
      }

      .today-grid {
        grid-template-columns: 1fr;
      }

      .checkin-sheet {
        position: static;
      }

      .calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .calendar-spacer {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .masthead-inner,
      .main-content {
        width: min(100% - 20px, 1180px);
      }

      .topline {
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .tab-button {
        min-width: 0;
        gap: 5px;
        padding: 8px 6px;
      }

      h1 {
        font-size: 22px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat-card {
        min-height: 104px;
        padding: 13px;
      }

      .stat-value {
        font-size: 23px;
      }

      .roadmap {
        grid-template-columns: 1fr;
      }

      .roadmap-stage.chapter3 {
        grid-column: auto;
      }

      .timeline-row {
        grid-template-columns: 105px minmax(0, 1fr);
      }

      .timeline-kind {
        display: none;
      }

      .calendar-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .calendar-day {
        min-height: 118px;
      }

      .chapter-row,
      .experiment-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .row-progress-value {
        text-align: left;
      }

      .section-heading-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <div class="masthead-inner">
        <div class="topline">
          <div class="title-block">
            <p class="eyebrow">硕士论文 · 30 天学习与写作计划</p>
            <h1>从零基础到第一至第三章初稿</h1>
            <p class="date-range">2026.08.02—08.31 · 每日目标 4.5 小时</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-dark" id="import-button" type="button">
              <i data-lucide="upload"></i>
              导入
            </button>
            <input class="sr-only" id="import-file" type="file" accept="application/json">
            <button class="btn btn-dark" id="export-button" type="button">
              <i data-lucide="download"></i>
              导出
            </button>
            <button class="btn btn-dark btn-danger" id="reset-button" type="button">
              <i data-lucide="rotate-ccw"></i>
              重置
            </button>
          </div>
        </div>
        <div class="save-status" aria-live="polite">
          <span class="save-dot"></span>
          <span id="save-status-text">本地记录已就绪</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="stats-grid" aria-label="总体进度">
        <article class="stat-card">
          <div class="stat-label">任务完成率</div>
          <div class="stat-value" id="stat-completion">0%</div>
          <div class="stat-context" id="stat-task-context">0 / 0 项</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">累计学习</div>
          <div class="stat-value" id="stat-hours">0 h</div>
          <div class="stat-context">目标 135 小时</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">连续完成</div>
          <div class="stat-value" id="stat-streak">0 天</div>
          <div class="stat-context">按整日任务计算</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">当前阶段</div>
          <div class="stat-value" id="stat-phase">基础补课</div>
          <div class="stat-context" id="stat-phase-context">建立知识地图</div>
        </article>
      </section>

      <section class="roadmap-section" aria-labelledby="roadmap-heading">
        <div class="section-heading-row">
          <h2 id="roadmap-heading">月度路线</h2>
          <span class="section-note">学习、写作和实验按依赖关系推进</span>
        </div>
        <div class="roadmap" id="roadmap"></div>
      </section>

      <nav class="tabs" aria-label="计划视图">
        <button class="tab-button" type="button" data-view="today" aria-selected="true">
          <i data-lucide="sun"></i>
          今日
        </button>
        <button class="tab-button" type="button" data-view="calendar" aria-selected="false">
          <i data-lucide="calendar-days"></i>
          日历
        </button>
        <button class="tab-button" type="button" data-view="chapters" aria-selected="false">
          <i data-lucide="book-open"></i>
          章节
        </button>
        <button class="tab-button" type="button" data-view="experiments" aria-selected="false">
          <i data-lucide="flask-conical"></i>
          实验
        </button>
      </nav>

      <section class="view-panel is-active" id="view-today" data-view="today"></section>

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'thesis-study-tracker-v1';
      var plan = JSON.parse(document.getElementById('plan-data').textContent);
      var phaseMap = Object.fromEntries(plan.phases.map(function (phase) {
        return [phase.id, phase];
      }));
      var weekdayLabels = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var state = loadState();

      function defaultState() {
        return {
          completed: {},
          hours: {},
          notes: {},
          selectedDate: chooseInitialDate(),
          activeView: 'today',
          savedAt: null
        };
      }

      function chooseInitialDate() {
        var today = new Date();
        var localDate = [
          today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, '0'),
          String(today.getDate()).padStart(2, '0')
        ].join('-');
        var inPlan = plan.days.some(function (day) {
          return day.date === localDate;
        });
        return inPlan ? localDate : plan.days[0].date;
      }

      function loadState() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) {
            return defaultState();
          }
          return Object.assign(defaultState(), JSON.parse(stored));
        } catch (error) {
          return defaultState();
        }
      }

      function saveState(message) {
        state.savedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        var target = document.getElementById('save-status-text');
        target.textContent = message || '刚刚保存';
      }

      function createElement(tag, className, text) {
        var element = document.createElement(tag);
        if (className) {
          element.className = className;
        }
        if (text !== undefined && text !== null) {
          element.textContent = text;
        }
        return element;
      }

      function appendIcon(parent, name) {
        var icon = document.createElement('i');
        icon.setAttribute('data-lucide', name);
        parent.appendChild(icon);
        return icon;
      }

      function refreshIcons() {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      function taskKey(day, taskIndex) {
        return day.date + ':' + taskIndex;
      }

      function completedTasksForDay(day) {
        return day.tasks.filter(function (_, index) {
          return Boolean(state.completed[taskKey(day, index)]);
        }).length;
      }

      function dayPercent(day) {
        return Math.round((completedTasksForDay(day) / day.tasks.length) * 100);
      }

      function dayIsDone(day) {
        return completedTasksForDay(day) === day.tasks.length;
      }

      function totalTaskStats() {
        var total = 0;
        var done = 0;
        plan.days.forEach(function (day) {
          total += day.tasks.length;
          done += completedTasksForDay(day);
        });
        return { total: total, done: done };
      }

      function phasePercent(phaseId) {
        var days = plan.days.filter(function (day) {
          return day.phaseId === phaseId;
        });
        var total = days.reduce(function (sum, day) {
          return sum + day.tasks.length;
        }, 0);
        var done = days.reduce(function (sum, day) {
          return sum + completedTasksForDay(day);
        }, 0);
        return total ? Math.round((done / total) * 100) : 0;
      }

      function loggedHours() {
        return Object.values(state.hours).reduce(function (sum, value) {
          return sum + (Number(value) || 0);
        }, 0);
      }

      function completionStreak() {
        var longest = 0;
        var current = 0;
        plan.days.forEach(function (day) {
          if (dayIsDone(day)) {
            current += 1;
            longest = Math.max(longest, current);
          } else {
            current = 0;
          }
        });
        return longest;
      }

      function selectedDay() {
        return plan.days.find(function (day) {
          return day.date === state.selectedDate;
        }) || plan.days[0];
      }

      function formatDate(dateString) {
        var date = new Date(dateString + 'T00:00:00');
        return (date.getMonth() + 1) + ' 月 ' + date.getDate() + ' 日 · ' + weekdayLabels[date.getDay()];
      }

      function renderStats() {
        var stats = totalTaskStats();
        var percent = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
        var day = selectedDay();
        var phase = phaseMap[day.phaseId];
        document.getElementById('stat-completion').textContent = percent + '%';
        document.getElementById('stat-task-context').textContent = stats.done + ' / ' + stats.total + ' 项';
        document.getElementById('stat-hours').textContent = loggedHours().toFixed(1).replace('.0', '') + ' h';
        document.getElementById('stat-streak').textContent = completionStreak() + ' 天';
        document.getElementById('stat-phase').textContent = phase.label;
        document.getElementById('stat-phase-context').textContent = phase.goal;
      }

      function renderRoadmap() {
        var roadmap = document.getElementById('roadmap');
        roadmap.replaceChildren();
        plan.phases.forEach(function (phase) {
          var button = createElement('button', 'roadmap-stage ' + phase.id);
          button.type = 'button';
          button.style.setProperty('--stage-progress', phasePercent(phase.id) + '%');
          button.appendChild(createElement('strong', '', phase.label));
          button.appendChild(createElement('span', 'stage-dates', phase.dates));
          button.appendChild(createElement('span', 'stage-percent', phasePercent(phase.id) + '% 完成'));
          button.addEventListener('click', function () {
            var firstDay = plan.days.find(function (day) {
              return day.phaseId === phase.id && !dayIsDone(day);
            }) || plan.days.find(function (day) {
              return day.phaseId === phase.id;
            });
            state.selectedDate = firstDay.date;
            saveState('已切换到 ' + phase.label);
            activateView('today');
            renderAll();
          });
          roadmap.appendChild(button);
        });
      }

      function renderToday() {
        var day = selectedDay();
        var phase = phaseMap[day.phaseId];
        var panel = document.getElementById('view-today');
        panel.replaceChildren();

        var layout = createElement('div', 'today-grid');
        var daySheet = createElement('article', 'day-sheet');
        var header = createElement('div', 'sheet-header');
        var copy = createElement('div', 'sheet-header-copy');
        copy.appendChild(createElement('p', 'day-meta', phase.label + ' · ' + formatDate(day.date)));
        copy.appendChild(createElement('h2', 'day-title', day.title));
        header.appendChild(copy);

        var nav = createElement('div', 'day-nav');
        var dayIndex = plan.days.findIndex(function (item) {
          return item.date === day.date;
        });
        var prev = createElement('button', 'icon-btn');
        prev.type = 'button';
        prev.setAttribute('aria-label', '前一天');
        prev.disabled = dayIndex === 0;
        appendIcon(prev, 'chevron-left');
        prev.addEventListener('click', function () {
          if (dayIndex > 0) {
            state.selectedDate = plan.days[dayIndex - 1].date;
            saveState('已切换日期');
            renderAll();
          }
        });
        var next = createElement('button', 'icon-btn');
        next.type = 'button';
        next.setAttribute('aria-label', '后一天');
        next.disabled = dayIndex === plan.days.length - 1;
        appendIcon(next, 'chevron-right');
        next.addEventListener('click', function () {
          if (dayIndex < plan.days.length - 1) {
            state.selectedDate = plan.days[dayIndex + 1].date;
            saveState('已切换日期');
            renderAll();
          }
        });
        nav.append(prev, next);
        header.appendChild(nav);
        daySheet.appendChild(header);

        var scheduleSection = createElement('section', 'sheet-section');
        var scheduleHeading = createElement('div', 'subheading');
        appendIcon(scheduleHeading, 'clock-3');
        scheduleHeading.appendChild(createElement('h3', '', '今日时间块'));
        scheduleSection.appendChild(scheduleHeading);
        var timeline = createElement('div', 'timeline');
        day.blocks.forEach(function (block) {
          var row = createElement('div', 'timeline-row');
          row.appendChild(createElement('div', 'timeline-time', block.time));
          row.appendChild(createElement('div', 'timeline-kind', block.kind));
          row.appendChild(createElement('div', '', block.detail));
          timeline.appendChild(row);
        });
        scheduleSection.appendChild(timeline);
        daySheet.appendChild(scheduleSection);

        var learningSection = createElement('section', 'sheet-section');
        var learningHeading = createElement('div', 'subheading');
        appendIcon(learningHeading, 'brain');
        learningHeading.appendChild(createElement('h3', '', '需要学会'));
        learningSection.appendChild(learningHeading);
        var learningList = createElement('ul', 'learning-list');
        day.learning.forEach(function (item) {
          learningList.appendChild(createElement('li', '', item));
        });
        learningSection.appendChild(learningList);
        daySheet.appendChild(learningSection);

        var tasksSection = createElement('section', 'sheet-section');
        var tasksHeading = createElement('div', 'subheading');
        appendIcon(tasksHeading, 'list-checks');
        tasksHeading.appendChild(createElement('h3', '', '完成任务'));
        tasksSection.appendChild(tasksHeading);
        var taskList = createElement('div', 'task-list');
        day.tasks.forEach(function (task, taskIndex) {
          var key = taskKey(day, taskIndex);
          var row = createElement('div', 'task-row');
          var checkbox = document.createElement('input');
          var checkboxId = 'task-' + day.date + '-' + taskIndex;
          checkbox.type = 'checkbox';
          checkbox.id = checkboxId;
          checkbox.checked = Boolean(state.completed[key]);
          var label = createElement('label', '', task);
          label.htmlFor = checkboxId;
          checkbox.addEventListener('change', function () {
            state.completed[key] = checkbox.checked;
            saveState('任务进度已保存');
            renderAll();
          });
          row.append(checkbox, label);
          taskList.appendChild(row);
        });
        tasksSection.appendChild(taskList);
        daySheet.appendChild(tasksSection);

        var outputSection = createElement('section', 'sheet-section');
        var outputHeading = createElement('div', 'subheading');
        appendIcon(outputHeading, 'package-check');
        outputHeading.appendChild(createElement('h3', '', '当天产出'));
        outputSection.appendChild(outputHeading);
        outputSection.appendChild(createElement('div', 'output-box', day.output));
        daySheet.appendChild(outputSection);

        var checkin = createElement('aside', 'checkin-sheet');
        var checkinHeader = createElement('div', 'sheet-header');
        var checkinCopy = createElement('div', 'sheet-header-copy');
        checkinCopy.appendChild(createElement('p', 'day-meta', 'DAY ' + String(dayIndex + 1).padStart(2, '0')));
        checkinCopy.appendChild(createElement('h2', 'day-title', '学习打卡'));
        checkinHeader.appendChild(checkinCopy);
        checkin.appendChild(checkinHeader);

        var checkinBody = createElement('div', 'sheet-section');
        var doneCount = completedTasksForDay(day);
        var progressText = createElement('div', 'day-progress-text');
        progressText.appendChild(createElement('span', '', '任务进度'));
        progressText.appendChild(createElement('span', '', doneCount + ' / ' + day.tasks.length));
        checkinBody.appendChild(progressText);
        var track = createElement('div', 'day-progress-track');
        var fill = createElement('div', 'progress-fill');
        fill.style.width = dayPercent(day) + '%';
        track.appendChild(fill);
        checkinBody.appendChild(track);

        var hoursGroup = createElement('div', 'form-group');
        var hoursLabel = createElement('label', 'form-label');
        hoursLabel.htmlFor = 'hours-input';
        hoursLabel.appendChild(createElement('span', '', '实际学习时长'));
        hoursLabel.appendChild(createElement('span', 'form-hint', '目标 4.5 h'));
        var hoursInput = createElement('input', 'form-control');
        hoursInput.id = 'hours-input';
        hoursInput.type = 'number';
        hoursInput.min = '0';
        hoursInput.max = '12';
        hoursInput.step = '0.5';
        hoursInput.value = state.hours[day.date] || '';
        hoursInput.placeholder = '0';
        hoursInput.addEventListener('input', function () {
          var value = Math.max(0, Math.min(12, Number(hoursInput.value) || 0));
          state.hours[day.date] = value;
          saveState('学习时长已保存');
          renderStats();
        });
        hoursGroup.append(hoursLabel, hoursInput);
        checkinBody.appendChild(hoursGroup);

        var noteGroup = createElement('div', 'form-group');
        var noteLabel = createElement('label', 'form-label');
        noteLabel.htmlFor = 'note-input';
        noteLabel.appendChild(createElement('span', '', '复盘笔记'));
        noteLabel.appendChild(createElement('span', 'form-hint', '困难、发现、明日调整'));
        var noteInput = createElement('textarea', 'form-control');
        noteInput.id = 'note-input';
        noteInput.value = state.notes[day.date] || '';
        noteInput.placeholder = '记录今天真正理解了什么、哪里仍然卡住。';
        var saveTimer = null;
        noteInput.addEventListener('input', function () {
          state.notes[day.date] = noteInput.value;
          window.clearTimeout(saveTimer);
          saveTimer = window.setTimeout(function () {
            saveState('复盘笔记已保存');
          }, 250);
        });
        noteGroup.append(noteLabel, noteInput);
        checkinBody.appendChild(noteGroup);

        var actions = createElement('div', 'checkin-actions');
        var completeButton = createElement('button', 'btn btn-primary');
        completeButton.type = 'button';
        appendIcon(completeButton, dayIsDone(day) ? 'circle-check-big' : 'check-check');
        completeButton.appendChild(document.createTextNode(dayIsDone(day) ? '本日已完成' : '完成本日全部任务'));
        completeButton.disabled = dayIsDone(day);
        completeButton.addEventListener('click', function () {
          day.tasks.forEach(function (_, index) {
            state.completed[taskKey(day, index)] = true;
          });
          saveState('本日任务已全部完成');
          renderAll();
        });
        actions.appendChild(completeButton);
        checkinBody.appendChild(actions);
        checkin.appendChild(checkinBody);

        layout.append(daySheet, checkin);
        panel.appendChild(layout);
      }

      function renderCalendar() {
        var panel = document.getElementById('view-calendar');
        panel.replaceChildren();
        var header = createElement('div', 'calendar-header');
        header.appendChild(createElement('h2', '', '2026 年 8 月'));
        var legend = createElement('div', 'legend');
        plan.phases.forEach(function (phase) {
          var item = createElement('span', 'legend-item');
          var dot = createElement('span', 'legend-dot');
          dot.style.background = phase.color;
          item.append(dot, document.createTextNode(phase.label));
          legend.appendChild(item);
        });
        header.appendChild(legend);
        panel.appendChild(header);

        var grid = createElement('div', 'calendar-grid');
        for (var spacerIndex = 0; spacerIndex < 6; spacerIndex += 1) {
          grid.appendChild(createElement('div', 'calendar-spacer'));
        }
        plan.days.forEach(function (day) {
          var phase = phaseMap[day.phaseId];
          var date = new Date(day.date + 'T00:00:00');
          var button = createElement('button', 'calendar-day' + (dayIsDone(day) ? ' is-done' : ''));
          button.type = 'button';
          button.style.setProperty('--phase-color', phase.color);
          var top = createElement('div', 'calendar-day-top');
          top.appendChild(createElement('span', 'calendar-date', String(date.getDate())));
          top.appendChild(createElement('span', 'calendar-weekday', weekdayLabels[date.getDay()]));
          button.appendChild(top);
          button.appendChild(createElement('div', 'calendar-title', day.title));
          button.appendChild(createElement('div', 'calendar-progress', completedTasksForDay(day) + ' / ' + day.tasks.length + ' 项'));
          button.addEventListener('click', function () {
            state.selectedDate = day.date;
            saveState('已选择 ' + formatDate(day.date));
            activateView('today');
            renderAll();
          });
          grid.appendChild(button);
        });
        panel.appendChild(grid);
      }

      function renderChapters() {
        var panel = document.getElementById('view-chapters');
        panel.replaceChildren();
        var header = createElement('div', 'section-heading-row');
        header.appendChild(createElement('h2', '', '章节交付'));
        header.appendChild(createElement('span', 'section-note', '初稿目标与知识依赖'));
        panel.appendChild(header);

        var chapters = [
          {
            phaseId: 'foundation',
            kicker: '8.2—8.6',
            label: '基础补课',
            detail: '完成时间序列、异步缺失、概率预测、风险校准的最低知识闭环。'
          },
          {
            phaseId: 'chapter1',
            kicker: '8.7—8.12',
            label: '第一章 绪论',
            detail: '完成研究背景、三类研究现状、三个问题、三项创新与组织结构，建议 7000–9000 字。'
          },
          {
            phaseId: 'chapter2',
            kicker: '8.13—8.18',
            label: '第二章 理论基础',
            detail: '完成多元序列、异步表示、条件概率、指标与校准基础，建议 6000–8000 字。'
          },
          {
            phaseId: 'chapter3',
            kicker: '8.19—8.29',
            label: '第三章 规整表示与实验',
            detail: '完成数据协议、规整表示方法、轻量头独立实验、消融与缺失鲁棒性，形成章节 V1。'
          },
          {
            phaseId: 'wrap',
            kicker: '8.30—8.31',
            label: '三章统稿',
            detail: '完成逻辑、引用、术语、符号、图表和结果溯源检查，交付第一至第三章 V1。'
          }
        ];

        var list = createElement('div', 'chapter-list');
        chapters.forEach(function (chapter) {
          var percent = phasePercent(chapter.phaseId);
          var row = createElement('article', 'chapter-row');
          var name = createElement('div');
          name.appendChild(createElement('div', 'row-kicker', chapter.kicker));
          name.appendChild(createElement('h3', '', chapter.label));
          row.appendChild(name);
          row.appendChild(createElement('div', 'row-details', chapter.detail));
          var progress = createElement('div');
          progress.appendChild(createElement('div', 'row-progress-value', percent + '%'));
          var track = createElement('div', 'progress-track');
          var fill = createElement('div', 'progress-fill');
          fill.style.width = percent + '%';
          track.appendChild(fill);
          progress.appendChild(track);
          row.appendChild(progress);
          list.appendChild(row);
        });
        panel.appendChild(list);
      }

      function renderExperiments() {
        var panel = document.getElementById('view-experiments');
        panel.replaceChildren();
        var header = createElement('div', 'section-heading-row');
        header.appendChild(createElement('h2', '', '第三章实验链'));
        header.appendChild(createElement('span', 'section-note', '8.19—8.29 · 只验证规整表示'));
        panel.appendChild(header);

        var experiments = [
          {
            label: '数据协议核验',
            dates: ['2026-08-19', '2026-08-20'],
            detail: '核对 split、窗口边界、train-only normalization、固定 missing mask 和风险标签统计。'
          },
          {
            label: '表示方法拆解',
            dates: ['2026-08-21', '2026-08-23'],
            detail: '把时间、mask、多尺度、变量交互和工况模块映射到公式、消融与指标。'
          },
          {
            label: '实验方案冻结',
            dates: ['2026-08-24'],
            detail: '确定轻量头、核心基线、统一训练预算、主指标和可声称边界。'
          },
          {
            label: '冒烟与测试',
            dates: ['2026-08-25'],
            detail: '验证数据、维度、损失、checkpoint 和结果目录；调试结果不进入论文表格。'
          },
          {
            label: '表示主实验',
            dates: ['2026-08-26'],
            detail: '提交完整训练，记录 run_id、seed、配置、日志和 checkpoint 选择依据。'
          },
          {
            label: '消融与鲁棒性',
            dates: ['2026-08-27'],
            detail: '单变量控制消融，并扫描核心缺失率或缺失机制。'
          },
          {
            label: '结果与图表',
            dates: ['2026-08-28', '2026-08-29'],
            detail: '从原始结果生成可追溯表格和图，完成第三章实验分析。'
          }
        ];

        var list = createElement('div', 'experiment-list');
        experiments.forEach(function (experiment) {
          var relatedDays = experiment.dates.map(function (date) {
            return plan.days.find(function (day) {
              return day.date === date;
            });
          }).filter(Boolean);
          var total = relatedDays.reduce(function (sum, day) {
            return sum + day.tasks.length;
          }, 0);
          var done = relatedDays.reduce(function (sum, day) {
            return sum + completedTasksForDay(day);
          }, 0);
          var status = done === 0 ? '未开始' : done === total ? '已完成' : '进行中';
          var statusClass = done === 0 ? '' : done === total ? ' done' : ' active';
          var row = createElement('article', 'experiment-row');
          var name = createElement('div');
          name.appendChild(createElement('div', 'row-kicker', experiment.dates.map(function (date) {
            return Number(date.slice(-2)) + ' 日';
          }).join('、')));
          name.appendChild(createElement('h3', '', experiment.label));
          row.appendChild(name);
          row.appendChild(createElement('div', 'row-details', experiment.detail));
          row.appendChild(createElement('span', 'experiment-status' + statusClass, status));
          list.appendChild(row);
        });
        panel.appendChild(list);
      }

      function activateView(viewName) {
        state.activeView = viewName;
        document.querySelectorAll('.tab-button').forEach(function (button) {
          button.setAttribute('aria-selected', String(button.dataset.view === viewName));
        });
        document.querySelectorAll('.view-panel').forEach(function (panel) {
          panel.classList.toggle('is-active', panel.dataset.view === viewName);
        });
      }

      function renderAll() {
        renderStats();
        renderRoadmap();
        renderToday();
        renderCalendar();
        renderChapters();
        renderExperiments();
        activateView(state.activeView || 'today');
        refreshIcons();
      }

      function downloadBackup() {
        var payload = {
          app: 'thesis-study-tracker',
          version: 1,
          exportedAt: new Date().toISOString(),
          state: state
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'thesis-study-progress-2026-08.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        document.getElementById('save-status-text').textContent = '进度备份已导出';
      }

      function importBackup(file) {
        var reader = new FileReader();
        reader.addEventListener('load', function () {
          try {
            var payload = JSON.parse(String(reader.result));
            if (!payload || payload.app !== 'thesis-study-tracker' || !payload.state) {
              throw new Error('invalid backup');
            }
            state = Object.assign(defaultState(), payload.state);
            saveState('进度备份已导入');
            renderAll();
          } catch (error) {
            window.alert('无法导入：请选择由本页面导出的 JSON 备份。');
          }
        });
        reader.readAsText(file);
      }

      function resetProgress() {
        var confirmed = window.confirm('确定清空所有勾选、时长和复盘笔记吗？此操作不可撤销。');
        if (!confirmed) {
          return;
        }
        state = defaultState();
        localStorage.removeItem(STORAGE_KEY);
        saveState('全部进度已重置');
        renderAll();
      }

      document.querySelectorAll('.tab-button').forEach(function (button) {
        button.addEventListener('click', function () {
          activateView(button.dataset.view);
          saveState('视图已切换');
        });
      });

      document.getElementById('export-button').addEventListener('click', downloadBackup);
      document.getElementById('reset-button').addEventListener('click', resetProgress);
      document.getElementById('import-button').addEventListener('click', function () {
        document.getElementById('import-file').click();
      });
      document.getElementById('import-file').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (file) {
          importBackup(file);
        }
        event.target.value = '';
      });

      window.downloadBackup = downloadBackup;
      window.resetProgress = resetProgress;
      window.addEventListener('DOMContentLoaded', renderAll);
      window.addEventListener('load', refreshIcons);
    }());
  </script>
</body>
</html>
